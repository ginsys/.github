name: Org Settings

# Thin consumer of go-kure/.github: the settings script lives upstream and is checked out at
# main on every run (a first-party reusable at a mutable ref is go-kure's own pinning policy,
# mirrored here); only the policy, the label list and the environment below are this org's.
# Runs on the in-cluster runner group, which admits this repo (README.md, "Org-level settings
# applied by hand").
#
# Push and schedule always audit. `apply` exists only as a manual dispatch, after reading an
# audit — it deletes undeclared labels (README.md, "Settings flow").

on:
  push:
    branches: [main]
    paths:
      - 'governance/**'
      - 'standards/**'
  schedule:
    - cron: '0 6 * * *'  # Daily 6am UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: audit (dry-run, fails on issues) or apply (make changes)"
        default: audit
        required: true
        type: choice
        options:
          - audit
          - apply
      repo:
        description: >-
          Repository name or 'all'. Unlike upstream there is no 'org': SETTINGS_PAT carries no
          admin:org scope and the policy declares no github_org block.
        default: all
        required: false

jobs:
  settings:
    runs-on: autops-kube-ginsys
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out go-kure/.github (the settings script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: go-kure/.github
          ref: main
          path: upstream
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: yq jq

      - name: Run settings
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_PAT }}
          INPUT_MODE: ${{ inputs.mode || 'audit' }}
          INPUT_REPO: ${{ inputs.repo || 'all' }}
        run: |
          set -o pipefail
          # Exported in the shell rather than under env: — GitHub reserves the GITHUB_ prefix
          # for its own variables and rejects it in a workflow env block.
          export GITHUB_ORG=ginsys
          export GITHUB_REPOS_DEFAULT=".github bronzeward parley"
          export GITHUB_REPOS=".github bronzeward parley"
          export LABELS_FILE="$PWD/standards/labels.json"
          export POLICY_FILE="$PWD/governance/repository-settings-policy.yaml"
          FLAGS=(--ci --json)
          [ "$INPUT_MODE" = "apply" ] && FLAGS+=(--apply)
          # Only 'all' or a managed repo name reaches the script. A free-text input that starts
          # with '-' would otherwise be parsed as a flag ('repo=--apply' under mode=audit), and an
          # unmanaged name would fall back to GITHUB_REPOS_DEFAULT instead of failing.
          case "$INPUT_REPO" in
            all)
              bash upstream/scripts/github-settings.sh --all "${FLAGS[@]}" 2>&1 | tee settings-output.txt
              ;;
            org)
              echo "::error::repo=org is not supported here (no admin:org scope, no github_org block)"
              exit 1
              ;;
            *)
              managed=0
              for r in $GITHUB_REPOS; do
                [ "$INPUT_REPO" = "$r" ] && managed=1
              done
              if [ "$managed" -ne 1 ]; then
                echo "::error::repo='$INPUT_REPO' is not 'all' or a managed repository (GITHUB_REPOS=$GITHUB_REPOS)"
                exit 1
              fi
              bash upstream/scripts/github-settings.sh "$INPUT_REPO" "${FLAGS[@]}" 2>&1 | tee settings-output.txt
              ;;
          esac

      - name: Post summary
        if: always()
        env:
          INPUT_MODE: ${{ inputs.mode || 'audit' }}
        run: |
          [ -f github-settings-report.json ] || exit 0
          {
            echo "## Org Settings — ${INPUT_MODE}"
            echo ""
            python3 - <<'EOF'
          import json
          with open("github-settings-report.json") as f:
              d = json.load(f)
          print("| Repo | Labels | Settings | Rulesets | Status |")
          print("|------|--------|----------|----------|--------|")
          for r in d.get("repos", []):
              issues = r["labels_missing"] + r["labels_renamed"] + r.get("labels_extra", 0) + r.get("labels_duplicate", 0) + r.get("labels_drift", 0) + r["settings_missing"] + r["rulesets_missing"]
              status = "OK" if issues == 0 else f"**{issues} issues**"
              lbl = f"{r['labels_ok']} ok"
              if r["labels_missing"]: lbl += f", **{r['labels_missing']} missing**"
              if r["labels_renamed"]: lbl += f", **{r['labels_renamed']} to rename**"
              if r.get("labels_extra", 0): lbl += f", **{r['labels_extra']} extra**"
              if r.get("labels_duplicate", 0): lbl += f", **{r['labels_duplicate']} duplicate**"
              if r.get("labels_drift", 0): lbl += f", **{r['labels_drift']} metadata drift**"
              sett = f"{r['settings_ok']} ok"
              if r["settings_missing"]: sett += f", **{r['settings_missing']} wrong**"
              rs = f"{r['rulesets_ok']} ok"
              if r["rulesets_missing"]: rs += f", **{r['rulesets_missing']} wrong**"
              print(f"| `{r['repo']}` | {lbl} | {sett} | {rs} | {status} |")
          EOF
            if grep -qE 'MISSING|WRONG|LEGACY|RENAME|EXTRA|SKIP|CREATING|RENAMING|SETTING|UPDATING|DELETING|UNMANAGED|BLOCKED|DUPLICATE' settings-output.txt 2>/dev/null; then
              echo ""
              echo "## Changes"
              echo '```'
              grep -E 'Repository:|MISSING|WRONG|LEGACY|RENAME|EXTRA|SKIP|CREATING|RENAMING|SETTING|UPDATING|DELETING|BLOCKED|UNMANAGED|DUPLICATE' settings-output.txt
              echo '```'
            fi
            echo ""
            echo "_Generated: $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } >> "$GITHUB_STEP_SUMMARY"
