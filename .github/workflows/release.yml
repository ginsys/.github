name: Release

# Reusable release workflow (docs/release.md). One run does one action on the caller's repository: the
# `guard` job checks it and previews the release with no secret; the `release` job, only for a real
# run, cuts the release pull request, waits for its merge and makes the tag. A dry run (the default)
# stops after `guard`. A caller pins this workflow by commit SHA, because the real run holds the App key.
#
# The caller grants `contents: write` to the job that calls this workflow. The concurrency group is
# on the `release` job alone and never cancels: the group may not be built from `github.workflow`,
# which inside a called workflow is the caller's name (scripts/test/called-workflow-concurrency-test.sh).

on:
  workflow_call:
    inputs:
      action:
        description: >-
          One of release, release-as-beta, release-as-rc, release-as-stable, start-next-minor,
          start-next-major, skip-prerelease-number.
        type: string
        required: true
      dry_run:
        description: Check and preview only. Nothing is pushed, opened or tagged.
        type: boolean
        default: true
    secrets:
      RELEASE_APP_ID:
        description: The App ginsys-release-bot (real run only).
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Its private key (real run only).
        required: false
    outputs:
      tag:
        description: The tag this run makes (in a dry run, the tag a real run would make). Empty for an action that only moves VERSION.
        value: ${{ jobs.release.outputs.tag || jobs.guard.outputs.tag }}
      version:
        description: The tag without its leading v.
        value: ${{ jobs.release.outputs.version || jobs.guard.outputs.version }}
      sha:
        description: The commit the tag names (in a dry run, the dispatched commit).
        value: ${{ jobs.release.outputs.sha || jobs.guard.outputs.sha }}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      changelog_date: ${{ steps.check.outputs.changelog_date }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # actions/checkout reads an empty `ref` as the default branch, which would pair this workflow
      # with whatever script main holds. Refuse instead.
      - name: Require this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the scripts cannot be checked out at this workflow's own commit."
            exit 1
          fi

      # Full history, and the read-only workflow token kept: the checks list the remote's tags and
      # branches, which a private repository answers only to a token. No secret reaches this job.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Check and preview the release
        id: check
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/changelog-notes/notes.md
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$RELEASE_NOTES_FILE")"
          bash .release-tools/scripts/release/release.sh --check

      - name: Record the dispatched commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      # The notes the publish workflow reads, in a dry run too. An action with no tag has none.
      - name: Upload the release notes
        if: ${{ steps.check.outputs.tag != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/changelog-notes/notes.md
          if-no-files-found: error

  release:
    needs: guard
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The wait inside release.sh ends at 90 minutes (wait-merge.sh); the steps after it take a few
    # minutes. A job limit below that would cancel a run that is still waiting.
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.run.outputs.tag }}
      version: ${{ steps.run.outputs.version }}
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - name: Require this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the scripts cannot be checked out at this workflow's own commit."
            exit 1
          fi

      # Minted for the calling repository only.
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      # The App token stays in this checkout's git config: the release branch is pushed with it.
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false

      # The pull request, the merge and the waits use the App token. The tag is made with the workflow
      # token (TAG_TOKEN), so that it starts no workflow. The date is the one the guard read.
      - name: Release
        id: run
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          DRY_RUN: "0"
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHANGELOG_DATE: ${{ needs.guard.outputs.changelog_date }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG_TOKEN: ${{ github.token }}
        run: bash .release-tools/scripts/release/release.sh
