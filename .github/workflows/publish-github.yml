name: Publish GitHub release

# Reusable publish workflow (docs/release.md, "The publish workflow"). It turns the files that earlier
# jobs of the caller's run uploaded as `release-*` artifacts, and the release notes that release.yml
# uploaded as `changelog-notes`, into a GitHub release with a SHA256SUMS file. A dry run (the default)
# does everything except sign and publish, and uploads what it would have published as `publish-preview`.
#
# It sets no `permissions`, so its job holds what the calling job grants: `contents: write`, and with
# `sign` also `id-token: write` and `attestations: write`. A called workflow that asked for more than its
# caller grants would not start, so a caller that does not sign could not call one that asked for the lot.
# It reads no secret and checks out no repository of the caller: the files, the notes and the tag all come
# from the run and the API.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, as release.yml outputs it.
        type: string
        required: true
      sha:
        description: The commit the tag names (release.yml's `sha`).
        type: string
        required: true
      dry_run:
        description: Check, build the notes and the sums and upload a preview. Nothing is signed or published.
        type: boolean
        default: true
      sign:
        description: Sign SHA256SUMS with cosign and attest the files (a real run; the caller grants id-token and attestations).
        type: boolean
        default: false
      notes-footer:
        description: Text appended to the release notes, for example a fixed upgrade note.
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      TOOLS: .release-tools/scripts/release
    steps:
      # actions/checkout reads an empty `ref` as the default branch, which would pair this workflow
      # with whatever script main holds. Refuse instead.
      - name: Require this workflow's own commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the scripts cannot be checked out at this workflow's own commit."
            exit 1
          fi

      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
          persist-credentials: false

      # First of the checks, so that a re-run of a half-published release stops here.
      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$TOOLS/publish-guard.sh" absent "$TAG"

      - name: Refuse a tag that does not name the commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$TOOLS/publish-guard.sh" tagged "$TAG" "$SHA"

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/changelog-notes

      # Notes too long for a release body become a link to the section in CHANGELOG.md at the tag.
      - name: Write the release notes
        env:
          FOOTER: ${{ inputs.notes-footer }}
          CHANGELOG_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.tag }}/CHANGELOG.md
        run: bash "$TOOLS/publish-guard.sh" notes "$RUNNER_TEMP/changelog-notes/notes.md" "$FOOTER" "$RUNNER_TEMP/release-notes.md" "$CHANGELOG_URL"

      # Any job of the caller's run may upload `release-<anything>`; changelog-notes and publish-preview
      # do not match.
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          if [ ! -d dist ]; then
            echo "::error::this run has no release-* artifact, so there is nothing to publish."
            exit 1
          fi
          bash "$TOOLS/write-sums.sh" dist

      - name: Print the notes and the sums
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release notes for $TAG"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## SHA256SUMS"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          mkdir preview
          cp "$RUNNER_TEMP/release-notes.md" preview/release-notes.md
          cp -R dist preview/files

      - name: Upload the preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-preview
          path: preview
          retention-days: 14
          if-no-files-found: error

      - name: Install cosign
        if: ${{ inputs.sign && !inputs.dry_run }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SHA256SUMS
        if: ${{ inputs.sign && !inputs.dry_run }}
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest the files
        if: ${{ inputs.sign && !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # A pre-release tag is never Latest; a stable tag takes GitHub's default.
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if bash "$TOOLS/publish-guard.sh" prerelease "$TAG"; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}" dist/*
