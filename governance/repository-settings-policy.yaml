# GitHub repository settings for the ginsys organization.
#
# Read by go-kure/.github's scripts/github-settings.sh — this org keeps no copy of the script.
# .github/workflows/settings.yml checks out go-kure/.github@main into upstream/ and runs it with
# GITHUB_ORG=ginsys, GITHUB_REPOS_DEFAULT/GITHUB_REPOS naming the managed repos, POLICY_FILE
# pointing here and LABELS_FILE at standards/labels.json. Schema and semantics are the upstream
# file's (go-kure/.github governance/repository-settings-policy.yaml); only the values are ours.
#
# Managed repos: .github (this repo), bronzeward and parley. The org's other repos are not managed
# yet; each is its own onboarding (README.md, "Onboarding a repo").

github_defaults:
  # The scalar keys below must match the script's SETTING_KEYS exactly — its validation rejects
  # a missing or extra key — so this block is the upstream key set verbatim; only values differ.
  allow_rebase_merge: true
  allow_squash_merge: false
  allow_merge_commit: false
  delete_branch_on_merge: true
  allow_update_branch: true
  has_wiki: false
  allow_auto_merge: true
  has_projects: true
  has_issues: true
  has_discussions: false
  has_downloads: false
  is_template: false
  allow_forking: true
  web_commit_signoff_required: false
  # Inert while allow_merge_commit is false; recorded so the audit matches live reality.
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  security:
    secret_scanning: enabled
    secret_scanning_push_protection: enabled
    # Renovate's vulnerabilityAlerts lane (go-kure/.github renovate/shared.json, extended by
    # every managed repo's renovate.json) covers this; Dependabot security PRs would duplicate it.
    dependabot_security_updates: disabled
  # An empty map, never absent: the script's check_requirements exits when the key is missing.
  # Every ruleset in this org is repo-scoped under github_repos.<repo>.rulesets — a ruleset here
  # would need a repos: scope that is re-edited on every onboarding.
  rulesets: {}

github_repos:
  # This repo governs itself with the same defaults (rebase-only, auto-merge, delete on merge,
  # no wiki). No merge queue: nothing here needs the merged-result test a queue buys, so the
  # ruleset is go-kure/.github's own non-queue shape — strict up-to-date required checks.
  ".github":
    rulesets:
      main-protection:
        target: branch
        # Active from the start: `checks` (ci.yml's aggregator) already reported on this
        # repo's first PR, so the required context exists and cannot block every PR.
        enforcement: active
        conditions:
          ref_name:
            include: ["refs/heads/main"]
        rules:
          deletion: true
          non_fast_forward: true
          required_linear_history: true
          pull_request:
            required_approving_review_count: 0
            dismiss_stale_reviews_on_push: false
            require_code_owner_review: false
            require_last_push_approval: false
            required_review_thread_resolution: true
          required_status_checks:
            # strict: true — without a merge queue, only up-to-date enforcement guarantees
            # the checks ran against what actually lands.
            strict: true
            contexts:
              - checks                      # ci.yml aggregator job
  bronzeward:
    has_discussions: true
    rulesets:
      # Repo-only ruleset (no github_defaults entry), so it carries target, enforcement,
      # conditions and the full rule set itself — nothing is inherited. The shape is
      # go-kure/kure's main-protection (merge queue, REBASE, ALLGREEN, one entry at a time)
      # minus the release-bot bypass actor bronzeward has no use for yet.
      main-protection:
        target: branch
        # Active since both required contexts reported on a real PR (ginsys/bronzeward#33):
        # `checks` on its CI run and `pr-review / AI Code Review` on its PR Review run. The
        # ruleset was created disabled by the first apply (id 22481160); this flip is applied
        # by PUT in place. Rollback is the same one-word change back to `disabled`.
        enforcement: active
        conditions:
          ref_name:
            include: ["refs/heads/main"]
        rules:
          deletion: true
          non_fast_forward: true
          required_linear_history: true
          pull_request:
            required_approving_review_count: 0
            dismiss_stale_reviews_on_push: false
            require_code_owner_review: false
            require_last_push_approval: false
            required_review_thread_resolution: true
          required_status_checks:
            # strict: false — the merge queue tests the real merged result, so up-to-date
            # enforcement on the PR branch would only add rebases.
            strict: false
            contexts:
              - checks                      # bronzeward ci.yml aggregator job
              - pr-review / AI Code Review  # ginsys/.github pr-review.yml reusable (caller job `pr-review`)
          merge_queue:
            merge_method: REBASE
            grouping_strategy: ALLGREEN
            min_entries_to_merge: 1
            max_entries_to_merge: 1
            max_entries_to_build: 1
            min_entries_to_merge_wait_minutes: 0
            check_response_timeout_minutes: 60
      # Copilot code review, declared disabled so enabling it later is a one-word policy change.
      # Created by the first apply (id 22481159): GitHub accepts the copilot_code_review rule
      # type on this plan.
      "Code Quality Copilot review for default branch":
        target: branch
        enforcement: disabled
        conditions:
          ref_name:
            include: ["~DEFAULT_BRANCH"]
        rules:
          copilot_code_review:
            review_on_push: true
            review_draft_pull_requests: true
  parley:
    # Private repo; this org disallows forking private repositories. Applying github_defaults'
    # allow_forking: true here fails live: `gh api -X PATCH repos/ginsys/parley` returns 422
    # "This organization does not allow private repository forking." No ruleset (README.md,
    # "Managed repos" — GitHub Free plan doesn't support rulesets on private repos either).
    allow_forking: false

# No github_org block: the script's --org path needs a token with admin:org, which the
# repo-scoped SETTINGS_PAT does not carry. Org-level settings (runner group scope, fork-PR
# approval, per-repo Actions permissions) are applied by hand and recorded in README.md.
